<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reptile Monitoring System</title>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDt6oDqx2ZZZ3c5h0wrXVwJ5hOAtdmKw1E",
    databaseURL:"https://gecko-c6df6-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function badge(status){
    return status
    ? "<span class='on'>ON</span>"
    : "<span class='off'>OFF</span>";
}

const lastUpdate = {};
function loadESP(device){

    const refMon = ref(db,"monitoring/"+device);

    onValue(refMon,(snap)=>{

        const d=snap.val();
        if(!d) return;
        lastUpdate[device] = Date.now();

        document.getElementById(device+"_suhu").innerHTML=d.suhu+" °C";
        document.getElementById(device+"_hum").innerHTML=d.humidity+" %";
        document.getElementById(device+"_waktu").innerHTML=d.waktu;

        document.getElementById(device+"_uvb").innerHTML=badge(d.uvbStatus);
        document.getElementById(device+"_ldr").innerHTML =
         d.ldr + " (" + (d.ldrStatus || "--") + ")";
        document.getElementById(device+"_blower").innerHTML=badge(d.blowerStatus);

        document.getElementById(device+"_temps").style.width=Math.min(d.suhu*2,100)+"%";
        document.getElementById(device+"_hums").style.width=Math.min(d.humidity,100)+"%";

        document.getElementById(device+"_status").innerHTML =
        "<span class='on'>ONLINE</span>";
    });

}

window.pakanManual=function(device){

    set(ref(db,"control/"+device+"/pakanManual"),1);

    alert("Pakan Manual "+device+" dikirim!");

}

loadESP("esp1");
loadESP("esp2");

loadESP("esp1");
loadESP("esp2");

setInterval(() => {

    ["esp1","esp2"].forEach(device => {

        if(!lastUpdate[device] || Date.now() - lastUpdate[device] > 2000){

            document.getElementById(device+"_status").innerHTML =
            "<span class='off'>OFFLINE</span>";

        }

    });

},1000);

</script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

.ldrStatus{
    display:inline-block;
    margin-top:4px;
    padding:4px 10px;
    border-radius:12px;
    font-size:13px;
    font-weight:bold;
    background:#2b3445;
}

body{

background:linear-gradient(135deg,#101820,#182848);
min-height:100vh;
color:white;
padding:20px;

}

h1{

text-align:center;
margin-bottom:30px;
font-size:35px;
letter-spacing:2px;

}

.container{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
gap:25px;

}

.card{

background:#1f2937;
border-radius:20px;
padding:25px;
box-shadow:0 10px 25px rgba(0,0,0,.5);
transition:.3s;

}

.card:hover{

transform:translateY(-6px);

}

.card h2{

text-align:center;
margin-bottom:20px;
color:#00ffc3;

}

.row{

display:flex;
justify-content:space-between;
margin:12px 0;
font-size:18px;

}

.progress{

height:8px;
background:#444;
border-radius:20px;
overflow:hidden;
margin-bottom:15px;

}

.fill{

height:100%;
width:0%;
background:linear-gradient(90deg,#00ff9d,#00c3ff);

}

button{

width:100%;
margin-top:20px;
padding:15px;
font-size:17px;
border:none;
border-radius:15px;
background:#00d084;
color:white;
font-weight:bold;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#00a86b;
transform:scale(1.03);

}

.on{

background:#16a34a;
padding:5px 15px;
border-radius:20px;

}

.off{

background:#dc2626;
padding:5px 15px;
border-radius:20px;

}

.footer{

text-align:center;
margin-top:30px;
opacity:.7;

}

@media(max-width:600px){

h1{

font-size:25px;

}

.row{

font-size:16px;

}

.card{

padding:18px;

}

button{

font-size:15px;

}

}

</style>

</head>

<body>

<h1>🦎 REPTILE MONITORING SYSTEM</h1>

<div class="container">

<div class="card">

<h2>Kandang 1</h2>
<div class="row">
    <span>📶 Status</span>
    <div id="esp1_status">
        <span class="off">OFFLINE</span>
    </div>
</div>

<div class="row">
<span>🌡 Suhu</span>
<b id="esp1_suhu">--</b>
</div>

<div class="progress">
<div class="fill" id="esp1_temps"></div>
</div>

<div class="row">
<span>💧 Humidity</span>
<b id="esp1_hum">--</b>
</div>

<div class="progress">
<div class="fill" id="esp1_hums"></div>
</div>

<div class="row">
<span>☀ LDR</span>
<b id="esp1_ldr">--</b>
</div>

<div class="row">
<span>💡 UVB</span>
<div id="esp1_uvb">--</div>
</div>

<div class="row">
<span>🌪 Blower</span>
<div id="esp1_blower">--</div>
</div>

<div class="row">
<span>🕒 Waktu</span>
<b id="esp1_waktu">--</b>
</div>

<button onclick="pakanManual('esp1')">
🍽 PAKAN MANUAL
</button>

</div>

<div class="card">

<h2>kandang 2</h2>
<div class="row">
    <span>📶 Status</span>
    <div id="esp2_status">
        <span class="off">OFFLINE</span>
    </div>
</div>

<div class="row">
<span>🌡 Suhu</span>
<b id="esp2_suhu">--</b>
</div>

<div class="progress">
<div class="fill" id="esp2_temps"></div>
</div>

<div class="row">
<span>💧 Humidity</span>
<b id="esp2_hum">--</b>
</div>

<div class="progress">
<div class="fill" id="esp2_hums"></div>
</div>

<div class="row">
<span>☀ LDR</span>
<b id="esp2_ldr">--</b>
</div>

<div class="row">
<span>💡 UVB</span>
<div id="esp2_uvb">--</div>
</div>

<div class="row">
<span>🌪 Blower</span>
<div id="esp2_blower">--</div>
</div>

<div class="row">
<span>🕒 Waktu</span>
<b id="esp2_waktu">--</b>
</div>

<button onclick="pakanManual('esp2')">
🍽 PAKAN MANUAL
</button>

</div>

</div>

<div class="footer">
Realtime Firebase Monitoring • ESP32 • Responsive Web
</div>

</body>
</html>
